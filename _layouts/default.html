<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <!-- The capture block loads the markdown file, and markdownify converts it to HTML -->
    {% capture navbar_content %}{% include nav.md %}{% endcapture %}
    {{ navbar_content | markdownify }}

    {{ content }}
  </body>
</html>
