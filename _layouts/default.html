<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <nav class="site-nav">
        <ul>
            <li class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
                <a href="{{ '/index.html' | relative_url }}">Home</a>
            </li>
            <li class="{% if page.url == '/lab1.html' %}active{% endif %}">
                <a href="{{ '/lab1.html' | relative_url }}">Lab 1</a>
            </li>
            <li class="{% if page.url == '/lab2.html' %}active{% endif %}">
                <a href="{{ '/lab2.html' | relative_url }}">Lab 2</a>
            </li>
        </ul>
    </nav>
    <main>
      {{ content }}
    </main>
  </body>
</html>
