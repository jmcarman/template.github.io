<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="{{ site.author | escape }}">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="copyright" content="{{ site.copyright | escape }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <nav class="site-nav">
      {% capture nav_content %}{% include nav.md %}{% endcapture %}
      {{ nav_content | markdownify }}
    </nav>
    <main>
      {{ content }}
    </main>
    <footer>
      <div class="copyright">
        Copyright &copy; {{ site.time | date: '%Y' }} {{ site.author }}
      </div>
      <div class="license">
        This text is available under<a href="https://creativecommons.org/licenses/by-sa/4.0/"> {{ site.license }}</a>.
      </div>
    </footer>
  </body>
</html>
