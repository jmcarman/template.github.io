<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <nav class="site-nav">
      {% capture nav_content %}{% include nav.md %}{% endcapture %}
      {{ nav_content | markdownify }}
    </nav>
    <main>
      <p>The current relative page URL is {{ page.url }}</p>
      <p>The current absolute page URL is {{ page.url | absolute_url }}</p>
      {{ content }}
    </main>
  </body>
</html>
